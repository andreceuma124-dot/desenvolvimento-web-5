<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consumo de APIs, Assincronismo e DOM</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.5; }
    section { margin-bottom: 30px; padding: 15px; border: 1px solid #ccc; border-radius: 6px; }
    .status { font-weight: bold; margin-top: 10px; }
    .erro { color: red; }
    .sucesso { color: green; }
    .carregando { color: orange; }
    ul { list-style-type: none; padding-left: 0; }
    li { background: #f4f4f4; margin: 4px 0; padding: 6px 10px; border-radius: 4px; }
    dt { font-weight: bold; margin-top: 5px; }
    dd { margin-left: 0; margin-bottom: 5px; }
  </style>
</head>
<body>

  <h1>Consumo de APIs e Assincronismo</h1>

  <!-- PARTE 2: Buscador de CEP -->
  <section>
    <h2>Parte 2 - Buscador de CEP</h2>
    <form id="form-cep">
      <input type="text" id="input-cep" placeholder="Digite o CEP (ex: 01001000)" maxlength="9">
      <button type="submit" id="btn-buscar-cep">Buscar CEP</button>
    </form>
    
    <div id="status-cep" class="status"></div>
    <div id="resultado-cep"></div>

    <h3>Histórico de Buscas:</h3>
    <ul id="historico-cep"></ul>
  </section>

  <!-- PARTE 3: Mini Pokédex -->
  <section>
    <h2>Parte 3 - Mini Pokédex</h2>
    <form id="form-pokemon">
      <input type="text" id="input-pokemon" placeholder="Nome do Pokémon (ex: pikachu)">
      <button type="submit" id="btn-buscar-pokemon">Buscar Pokémon</button>
    </form>

    <div id="status-pokemon" class="status"></div>
    <div id="resultado-pokemon"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
